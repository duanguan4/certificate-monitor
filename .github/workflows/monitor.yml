name: Certificate monitor
on:
  schedule:
    - cron: '3-53/10 * * * *'
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Send a clearly labelled test email after a successful website check'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: certificate-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check required secrets
        id: config
        env:
          SITE_USERNAME: ${{ secrets.SITE_USERNAME }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python3 - <<'PY'
          import os
          keys = ['SITE_USERNAME', 'SITE_PASSWORD', 'SMTP_USER', 'SMTP_PASSWORD', 'MAIL_TO']
          missing = [k for k in keys if not os.environ.get(k)]
          print('Missing secrets: ' + ', '.join(missing) if missing else 'Configuration ready.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('ready=' + str(not missing).lower() + '\n')
          PY
      - name: Install browser
        if: steps.config.outputs.ready == 'true'
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m playwright install --with-deps chromium
      - name: Check certificates and notify
        if: steps.config.outputs.ready == 'true'
        env:
          SITE_USERNAME: ${{ secrets.SITE_USERNAME }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GITHUB_TOKEN: ${{ github.token }}
          TEST_EMAIL: ${{ github.event.inputs.test_email }}
        run: python3 monitor.py
